<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff7f00" />

    <title>Isterya | Web Developer</title>

    <!--
      Home page SEO and social tags for crawlers that do not run JavaScript (Telegram, LinkedIn,
      Facebook, X). Values mirror seoHome in src/data/seoData.ts; data-rh lets react-helmet-async
      replace them on other routes instead of adding duplicates.
    -->
    <meta
      name="description"
      content="A thoughtfully crafted personal portfolio showcasing my expertise in web development, UI/UX design, and full-stack architecture. Discover projects, skills, and creative approaches brought to life through clean code and aesthetic design."
      data-rh="true"
    />
    <link rel="canonical" href="https://isterya.dev/" data-rh="true" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Isterya" />
    <meta property="og:title" content="Isterya | Web Developer" data-rh="true" />
    <meta
      property="og:description"
      content="A thoughtfully crafted personal portfolio showcasing my expertise in web development, UI/UX design, and full-stack architecture. Discover projects, skills, and creative approaches brought to life through clean code and aesthetic design."
      data-rh="true"
    />
    <meta property="og:url" content="https://isterya.dev/" data-rh="true" />
    <meta property="og:image" content="https://isterya.dev/og/home.jpg" data-rh="true" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="629" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:title" content="Isterya | Web Developer" data-rh="true" />
    <meta
      name="twitter:description"
      content="A thoughtfully crafted personal portfolio showcasing my expertise in web development, UI/UX design, and full-stack architecture. Discover projects, skills, and creative approaches brought to life through clean code and aesthetic design."
      data-rh="true"
    />
    <meta name="twitter:image" content="https://isterya.dev/og/home.jpg" data-rh="true" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

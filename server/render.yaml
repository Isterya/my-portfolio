services:
  - type: web
    name: isterya-backend
    runtime: node
    rootDir: server
    region: oregon
    plan: free

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
